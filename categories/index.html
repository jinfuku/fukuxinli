<!DOCTYPE html>

<head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background-color: #f5f5f5;
      color: #333;
    }

     
    header {
      background: linear-gradient(135deg, #00c853 0%, #2196f3 100%);
      color: white;
      padding: 20px 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    
    .header-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 15px;
    }
    .header-logo {
      width: 70px;
      height: 70px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease;
    }
    .header-logo:hover {
      transform: scale(1.05) rotate(3deg);
    }
    .header-text {
      text-align: left;
    }

    header .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 0.8;
    }

     
    .main-content {
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 250px 1fr 300px;
      gap: 30px;
    }

     
    .sidebar-left {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      height: fit-content;
    }

    .sidebar-left h3 {
      color: #00c853;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .sidebar-left ul {
      list-style: none;
    }

    .sidebar-left li {
      margin-bottom: 10px;
    }

    .sidebar-left a {
      color: #333;
      text-decoration: none;
      transition: color 0.3s;
    }

    .sidebar-left a:hover {
      color: #00c853;
    }

     
    .article-list {
      background: white;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .article-list h2 {
      color: #2196f3;
      margin-bottom: 25px;
      font-size: 32px;
    }

    .article {
      padding: 25px;
      margin-bottom: 25px;
      border-bottom: 1px solid #eee;
      border-radius: 8px;
      transition: background 0.3s;
    }

    .article:hover {
      background: #f9f9f9;
    }

    .article:last-child {
      border-bottom: none;
    }

    .article h3 {
      color: #00c853;
      margin-bottom: 12px;
      font-size: 24px;
    }

    .article a {
      color: #00c853;
      text-decoration: none;
      transition: color 0.3s;
    }

    .article a:hover {
      color: #2196f3;
    }

    .article .meta {
      color: #999;
      font-size: 14px;
      margin-top: 8px;
    }

    .article .summary {
      color: #666;
      margin-top: 12px;
      line-height: 1.6;
    }

     
    .sidebar-right {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      height: fit-content;
    }

    .sidebar-right h3 {
      color: #2196f3;
      margin-bottom: 15px;
      font-size: 20px;
    }

     
    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 30px 0;
      margin-top: 40px;
    }

     
    @media (max-width: 1024px) {
      .main-content {
        grid-template-columns: 1fr;
      }

      .sidebar-left,
      .sidebar-right {
        display: none;
      }
    }
  </style>
</head>
